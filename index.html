<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Split the Bill — veraetogrex_portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Split the Bill · zero dependencies · github.com/veraetogrex-portfolio -->
  <section class="sb" id="bill" aria-label="Split a receipt by dragging people onto lines">
    <header class="sb-top">
      <h1 class="sb-title">Split the bill</h1>
      <p class="sb-rules"><span>Receipt</span><b>Drag people onto lines</b><b>Shared lines split evenly</b></p>
    </header>

    <div class="sb-panel sb-receipt">
      <p class="sb-place"><span>Nori Bar · table 7</span><span>21:40</span></p>
      <div class="sb-lines">
          <div class="sb-line" data-i="0"><div class="sb-row"><b>Ramen<small>×2</small></b><em>$32</em></div><div class="sb-bar"><i data-p="ana" style="background:var(--ana)"></i><i data-p="max" style="background:var(--max)"></i><i data-p="kai" style="background:var(--kai)"></i></div></div>
          <div class="sb-line" data-i="1"><div class="sb-row"><b>Gyoza<small></small></b><em>$9</em></div><div class="sb-bar"><i data-p="ana" style="background:var(--ana)"></i><i data-p="max" style="background:var(--max)"></i><i data-p="kai" style="background:var(--kai)"></i></div></div>
          <div class="sb-line" data-i="2"><div class="sb-row"><b>Sake<small></small></b><em>$18</em></div><div class="sb-bar"><i data-p="ana" style="background:var(--ana)"></i><i data-p="max" style="background:var(--max)"></i><i data-p="kai" style="background:var(--kai)"></i></div></div>
          <div class="sb-line" data-i="3"><div class="sb-row"><b>Matcha<small>×3</small></b><em>$15</em></div><div class="sb-bar"><i data-p="ana" style="background:var(--ana)"></i><i data-p="max" style="background:var(--max)"></i><i data-p="kai" style="background:var(--kai)"></i></div></div>
          <div class="sb-line" data-i="4"><div class="sb-row"><b>Tip<small>12%</small></b><em>$12</em></div><div class="sb-bar"><i data-p="ana" style="background:var(--ana)"></i><i data-p="max" style="background:var(--max)"></i><i data-p="kai" style="background:var(--kai)"></i></div></div>
      </div>
      <div class="sb-total"><span>Total</span><b>$86</b></div>
    </div>

    <div class="sb-panel sb-people">
      <p>Who had what</p>
      <button class="sb-rest">Split the rest evenly</button>
        <div class="sb-person" data-p="ana" style="--c:var(--ana)"><span class="sb-ava" data-p="ana" aria-label="Drag Ana onto a line">A</span><div class="sb-who"><b>Ana</b><span>you</span></div><span class="sb-owe"><small>Pay</small>$<b class="sb-sum">0</b></span></div>
        <div class="sb-person" data-p="max" style="--c:var(--max)"><span class="sb-ava" data-p="max" aria-label="Drag Max onto a line">M</span><div class="sb-who"><b>Max</b><span>friend</span></div><span class="sb-owe"><small>Pay</small>$<b class="sb-sum">0</b></span></div>
        <div class="sb-person" data-p="kai" style="--c:var(--kai)"><span class="sb-ava" data-p="kai" aria-label="Drag Kai onto a line">K</span><div class="sb-who"><b>Kai</b><span>friend</span></div><span class="sb-owe"><small>Pay</small>$<b class="sb-sum">0</b></span></div>
    </div>

    <div class="sb-verdict" role="status">
      <p class="sb-caption">Drag a friend onto what they had.</p>
      <p class="sb-score">$86<span class="a">→</span><span class="sb-parts"></span></p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
